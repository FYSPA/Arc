name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match a pushed tag)'
        required: true
        default: 'v1.0.0-beta.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout release tag
        run: |
          git fetch --tags origin
          git checkout ${{ github.event.inputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'

      - name: Authenticate git for private Arx-Canvas
        run: git config --global url."https://${{ secrets.REPO_TOKEN }}@github.com/FYSPA/Arx-Canvas.git".insteadOf "https://github.com/FYSPA/Arx-Canvas.git"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Arc ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
